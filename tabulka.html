<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./tabulka.css?v=3">
    <title>Tipovacia hra</title>
</head>
<body>
    <h1>Tabuľka výsledkov</h1>

    <section class="account-controls" aria-label="Prihlásenie">
        <button id="btn-admin-login">Admin prihlásenie</button>
        <button id="btn-register">Registrovať sa</button>
        <button id="btn-login">Prihlásiť sa</button>
        <button id="btn-logout">Odhlásiť sa</button>
        <button id="btn-refresh">Obnoviť údaje</button>
        <p id="login-info">Nikto nie je prihlásený</p>
    </section>

    <div id="admin-panel"></div>

    <section id="admin-game-controls" aria-label="Správa hry">
        <p class="permission-note">Kolá, zápasy a výsledky môže pridávať každý schválený hráč. Mazanie a zálohy sú iba pre admina.</p>
        <input
            type="text"
            id="round-name"
            placeholder="Názov kola"
        >

        <input
            type="datetime-local"
            id="round-deadline"
        >

        <button id="btn-round">Pridať kolo</button>
        <button id="btn-reset">Vymazať všetko</button>
        <button id="btn-backup">Stiahnuť zálohu</button>
        <button id="btn-restore">Nahrať zálohu</button>

        <input
            type="file"
            id="backup-file"
            accept=".json"
            hidden
        >
    </section>

    <div class="table-scroll">
        <table>
            <thead>
                <tr>
                    <th>Poradie</th>
                    <th>Meno</th>
                    <th>Body</th>
                </tr>
            </thead>
            <tbody id="table-body"></tbody>
        </table>
    </div>

    <h1>Tabuľka zápasov</h1>
    <div id="table-round"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./tabulka.js?v=3"></script>
</body>
</html>
